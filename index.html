/* ---------- Date helpers ---------- */
function dateToKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function todayKey(){ return dateToKey(new Date()); }
function keyToDate(key){ const [y,m,d]=key.split("-").map(Number); return new Date(y,m-1,d); }
function formatDateLabel(key){
  const d = keyToDate(key);
  const days = ["일","월","화","수","목","금","토"];
  return `${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
}
function shiftDateKey(key, delta){ const d = keyToDate(key); d.setDate(d.getDate()+delta); return dateToKey(d); }
function sortByName(arr){ return [...arr].sort((a,b) => a.name.localeCompare(b.name, "ko")); }

const WEEKDAYS = ["월","화","수","목","금","토","일"];
function getWeekdayKorean(key){
  const d = keyToDate(key);
  const map = ["일","월","화","수","목","금","토"];
  return map[d.getDay()];
}
function isScheduledDay(resident, dateKey){
  if (!resident.schedule || resident.schedule.length === 0) return true;
  return resident.schedule.includes(getWeekdayKorean(dateKey));
}
// 저장된 출결값이 없을 때, 이 어르신이 오늘 자동 등원예정 요일이면 true
function isAutoExpectedDay(resident, dateKey){
  if (!resident.autoExpected || resident.autoExpected.length === 0) return false;
  return resident.autoExpected.includes(getWeekdayKorean(dateKey));
}
// 실제 저장값 우선, 없으면 자동 등원예정 요일이면 "expected"로 취급
function effectiveStatus(resident, dateKey){
  const saved = (S.attendance[dateKey] || {})[resident.id];
  if (saved) return saved;
  if (isAutoExpectedDay(resident, dateKey)) return "expected";
  return undefined;
}
// 자동 등원예정일 때 보여줄 사유 (저장된 사유 우선, 없으면 자동 기본사유)

function computeMonthStats(){
  const ym = S.calMonth; // "YYYY-MM"
  const dateKeys = Object.keys(S.attendance).filter(k => k.startsWith(ym + "-"));

  // 개인별 출석/결석 일수
  const perPerson = {};
  S.residents.forEach(r => { perPerson[r.id] = { present: 0, absent: 0, expected: 0 }; });

  // 사유별 집계 (결석)
  const reasonCounts = {};       // { "병원": 3, ... }
  const reasonDetails = {};      // { "병원": ["김OO(8/3)", ...] }

  dateKeys.forEach(dateKey => {
    const day = S.attendance[dateKey] || {};
    const dayAbsentReasons = S.absentReasons[dateKey] || {};
    const dd = keyToDate(dateKey);
    const dLabel = `${dd.getMonth()+1}/${dd.getDate()}`;
    S.residents.forEach(r => {
      const st = day[r.id];
      if (!st) return;
      if (perPerson[r.id]) perPerson[r.id][st] = (perPerson[r.id][st] || 0) + 1;
      if (st === "absent") {
        const reason = (dayAbsentReasons[r.id] || "").trim() || "사유 미입력";
        reasonCounts[reason] = (reasonCounts[reason] || 0) + 1;
        if (!reasonDetails[reason]) reasonDetails[reason] = [];
        reasonDetails[reason].push(`${r.name}(${dLabel})`);
      }
    });
  });

  return { perPerson, reasonCounts, reasonDetails, dayCount: dateKeys.length };
}

function longAbsentDates(){
  if (!S.longAbsent) return [];
  const { from, to } = S.longAbsent;
  if (!from || !to || from > to) return [];
  const dates = [];
  let cur = from;
  let guard = 0;
  while (cur <= to && guard < 400) {
    const d = keyToDate(cur);
    if (d.getDay() !== 0) dates.push(cur); // 일요일(0) 제외
    cur = shiftDateKey(cur, 1);
    guard++;
  }
  return dates;
}
function longAbsentPreviewText(){
  const dates = longAbsentDates();
  if (dates.length === 0) return `<span style="color:#C98D74;">시작일이 종료일보다 늦어요</span>`;
  return `일요일 빼고 <b>${dates.length}일</b>이 결석으로 지정돼요`;
}
function applyLongAbsent(){
  if (!S.longAbsent) return;
  const { id, reason } = S.longAbsent;
  const fromEl = document.getElementById("longAbsentFrom");
  const toEl = document.getElementById("longAbsentTo");
  const reasonEl = document.getElementById("longAbsentReason");
  const from = fromEl ? fromEl.value : S.longAbsent.from;
  const to = toEl ? toEl.value : S.longAbsent.to;
  const rsn = reasonEl ? reasonEl.value.trim() : (reason || "").trim();
  S.longAbsent = { ...S.longAbsent, from, to, reason: rsn };
  const dates = longAbsentDates();
  if (dates.length === 0) { alert("날짜를 다시 확인해주세요."); return; }

  const newAttendance = { ...S.attendance };

    newAttendance[dateKey] = day;
    if (rsn) {

      dayReason[id] = rsn;
      newAbsentReasons[dateKey] = dayReason;
    }
  });
  S.attendance = newAttendance;
  S.absentReasons = newAbsentReasons;
  saveAttendance();

  const name = S.longAbsent.name;
  S.longAbsent = null;
  render();

}

function downloadBlob(blob, filename){
  // iOS 홈화면 앱 모드에서는 공유 시트를 통해 저장 (파일 앱, 메일 등으로 보낼 수 있음)
  try {
    if (navigator.canShare && window.File) {
      const file = new File([blob], filename, { type: blob.type });
      if (navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: filename }).catch(() => fallbackDownload(blob, filename));
        return;
      }
    }
  } catch (e) { /* 무시하고 아래 방식으로 */ }
  fallbackDownload(blob, filename);
}

function fallbackDownload(blob, filename){
  const url = URL.createObjectURL(blob);
  // 새 탭으로 열기 (iOS Safari에서 다운로드 대신 표시되면 사용자가 공유버튼으로 저장 가능)
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.target = "_blank";
  a.rel = "noopener";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => {
    // 클릭이 안 먹은 경우 대비: 새 창으로 직접 열기
    try { window.open(url, "_blank"); } catch(e) {}
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }, 300);
}

      r.name,
      r.floor,
      st ? STATUS[st].label : "미체크",
      reasonCell,
      r.vehicle,
    ]);
  });

  const csv = rows.map(row =>
    row.map(cell => {
      const s = String(cell === undefined || cell === null ? "" : cell);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }).join(",")
  ).join("\r\n");

  // BOM 추가해서 엑셀에서 한글 안 깨지게
  const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
  downloadBlob(blob, `출석현황_${dateKey}.csv`);
}

function exportToExcel(){
  try {
    const dateKey = S.selectedDate;
    const dateLabel = formatDateLabel(dateKey);
    const todayAttendance = S.attendance[dateKey] || {};
    const todayMeals = S.meals[dateKey] || {};
    const counts = computeCounts();

    const dayReasons = S.absentReasons[dateKey] || {};
    const absentNames = S.residents.filter(r => todayAttendance[r.id] === "absent").map(r => {
      const rs = dayReasons[r.id];
      return rs ? `${r.name}(${rs})` : r.name;
    });
    const expDayReasons = S.expectedReasons[dateKey] || {};
    const expectedNames = S.residents.filter(r => {
      const saved = todayAttendance[r.id];
      return saved === "expected" || (!saved && isAutoExpectedDay(r, dateKey));
    }).map(r => {
      const rs = expDayReasons[r.id];
      return rs ? `${r.name}(${rs})` : r.name;
    });

    exportAsCSV(dateKey, dateLabel, todayAttendance, todayMeals, counts, absentNames, expectedNames);
  } catch (e) {
    console.error(e);
    alert("내보내기에 실패했어요: " + (e && e.message ? e.message : e));
  }
}

/* ---------- Render helpers ---------- */
function esc(str){
  return String(str).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function renderReasonBox(id, kind){
  const isAbsent = kind === "absent";
  const reasonList = isAbsent ? ABSENT_REASONS : EXPECTED_REASONS;
  const store = isAbsent ? S.absentReasons : S.expectedReasons;
  const setter = isAbsent ? "setAbsentReason" : "setExpectedReason";
  const theme = isAbsent
    ? { active: "#D39282", chipBorder: "#E3D5D0", chipText: "#B08575", boxBg: "#FBF3F0", boxBorder: "#F0DED8", label: "#B08575" }
    : { active: "#C9A94E", chipBorder: "#E6DCC0", chipText: "#9A8442", boxBg: "#FBF7EC", boxBorder: "#EDE3C8", label: "#9A8442" };
  const reasons = store[S.selectedDate] || {};
  const current = reasons[id] || "";
  const chips = reasonList.map(rs => {
    const active = current === rs;
    return `<button onclick="${setter}('${id}', ${active ? "''" : `'${rs}'`})" style="padding:5px 11px;border-radius:8px;border:1.5px solid ${active ? theme.active : theme.chipBorder};background:${active ? theme.active : "#fff"};color:${active ? "#fff" : theme.chipText};font-size:12px;font-weight:700;">${rs}</button>`;
  }).join("");
  const isPreset = reasonList.includes(current);
  const customVal = isPreset ? "" : current;
  return `
    <div style="background:${theme.boxBg};border:1.5px solid ${theme.boxBorder};border-top:none;border-radius:0 0 12px 12px;padding:9px 12px;margin-top:-2px;">
      <div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center;">
        <span style="font-size:11px;font-weight:800;color:${theme.label};margin-right:2px;">사유</span>
        ${chips}
      </div>
      <input value="${esc(customVal)}" placeholder="직접 입력 (선택)"
        onchange="${setter}('${id}', this.value)"
        style="width:100%;margin-top:7px;padding:7px 10px;border-radius:8px;border:1.5px solid ${theme.boxBorder};font-size:13px;background:#fff;color:#5A5852;outline:none;box-sizing:border-box;" />
    </div>
  `;
}

    const vehicleBlocks = vehicleOrder.map(v => {

      if (vehicleList.length === 0) return "";

      const floorRows = FLOORS.map(floor => {

      return `
        <div class="vehicle-card" style="background:${c.bg};border:1.5px solid ${c.border};margin-bottom:10px;">
          <div class="vehicle-head" style="color:${c.text};"><span>🚌</span><span>${v}</span><span style="font-size:12px;opacity:0.7;">${vehicleList.length}명</span></div>
          ${floorRows}
        </div>
      `;
    }).join("");

    return `
      <div style="margin-bottom:22px;">
        <div style="display:flex;align-items:center;gap:8px;background:${headerColor};color:#fff;padding:12px 16px;border-radius:14px;margin-bottom:10px;">

      </div>

  const dayPeople = present.filter(r => !r.night);
  const nightPeople = present.filter(r => r.night);

  let html = renderShift("주간반", "4시 하원", dayPeople, "#6B8A7A", VEHICLES);
  if (nightPeople.length > 0) {
    html += renderShift("야간반", "5시 하원", nightPeople, "#5C4463", NIGHT_VEHICLE_ORDER);
  }
  return html;
}

                <span style="font-size:15px;font-weight:800;color:#343432;">${f}</span>

              <div style="display:flex;gap:6px;">

      <div class="meal-summary-row" style="margin-top:10px;">

    const list = sortByName(S.residents.filter(r => r.floor === floor));

/* ---------- Main render ---------- */
function renderSearchBar(){
  return `
    <div style="display:flex;align-items:center;gap:8px;background:#fff;border:2px solid #ECEAE5;border-radius:12px;padding:8px 12px;margin-bottom:14px;">
      <span style="font-size:15px;">🔍</span>
      <input id="searchInput" placeholder="이름 검색" value="${esc(S.search)}"
        oninput="updateSearch(this.value)"
        onfocus="S._searchFocused=true"
        onblur="S._searchFocused=false"
        style="flex:1;border:none;outline:none;font-size:15px;background:transparent;color:#343432;" />
      ${S.search ? `<button onclick="clearSearch()" style="border:none;background:#EFEDE8;border-radius:50%;width:22px;height:22px;font-size:13px;color:#9E9C96;">✕</button>` : ""}
    </div>
  `;
}

function renderSearchResults(){
  const todayAttendance = S.attendance[S.selectedDate] || {};
  const q = S.search.trim();
  const matches = S.residents
    .filter(r => r.name.includes(q))
    .sort((a, b) => {
      if (a.floor !== b.floor) return a.floor.localeCompare(b.floor, "ko");
      return a.name.localeCompare(b.name, "ko");
    });

  if (matches.length === 0) {
    return `<div class="floor-empty">"${esc(q)}" 검색 결과가 없어요</div>`;
  }

  return matches.map(r => {
    const saved = todayAttendance[r.id];
    const current = effectiveStatus(r, S.selectedDate);
    const borderColor = current ? STATUS[current].color : "#ECEAE5";
    const bg = current ? STATUS[current].bg : "#fff";
    const btns = Object.entries(STATUS).map(([key, s]) => {
      const active = current === key;
      return `
        <button class="status-btn" style="border-color:${active ? s.color : "#DEDBD3"};background:${active ? s.color : "#fff"};color:${active ? "#fff" : "#5A5852"};" onclick="setStatus('${r.id}','${key}')">
          <span>${s.icon}</span><span>${s.label}</span>
        </button>
      `;
    }).join("");
    return `
      <div style="margin-bottom:6px;">
        <div class="resident-row" style="border-color:${borderColor};background:${bg};margin-bottom:0;">
          <div style="flex-shrink:0;min-width:64px;">
            <div class="resident-name" style="margin:0;">${esc(r.name)}</div>
            <div style="font-size:10px;font-weight:700;color:#9E9C96;margin-top:1px;">${r.floor}${r.night ? " · 야간" : ""}</div>
          </div>
          <div class="status-group">${btns}</div>
        </div>
        ${saved === "absent" ? renderReasonBox(r.id, "absent") : saved === "expected" ? renderReasonBox(r.id, "expected") : ""}
      </div>
    `;
  }).join("");
}

function renderStatusModal(){
  if (!S.statusModal) return "";
  const status = S.statusModal;
  const floorFilter = S.statusModalFloor;
  const s = status === "unchecked"
    ? { label: "미체크", color: "#9E9C96", bg: "#F0EFEB" }
    : STATUS[status];
  const todayAttendance = S.attendance[S.selectedDate] || {};
  const dayAbsentReasons = S.absentReasons[S.selectedDate] || {};
  const dayExpectedReasons = S.expectedReasons[S.selectedDate] || {};
  const showReason = (status === "absent" || status === "expected");
  const list = S.residents
    .filter(r => { const eff = effectiveStatus(r, S.selectedDate); return status === "unchecked" ? !eff : eff === status; })
    .filter(r => floorFilter ? r.floor === floorFilter : true)
    .sort((a, b) => {
      if (a.floor !== b.floor) return a.floor.localeCompare(b.floor, "ko");
      return a.name.localeCompare(b.name, "ko");
    });

  const targetFloors = floorFilter ? [floorFilter] : FLOORS;
  const byFloor = targetFloors.map(floor => {
    const fl = list.filter(r => r.floor === floor);
    if (fl.length === 0) return "";
    const rows = fl.map(r => {
      const reason = status === "absent" ? dayAbsentReasons[r.id]
                   : status === "expected" ? effectiveExpectedReason(r, S.selectedDate) : "";
      const reasonTag = (showReason && reason)
        ? `<span style="font-size:12px;font-weight:700;color:${s.color};background:${s.bg};padding:2px 9px;border-radius:8px;">${esc(reason)}</span>`
        : (showReason ? `<span style="font-size:12px;font-weight:600;color:#B8B6AE;">사유 미입력</span>` : "");
      return `
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;border:1.5px solid ${s.color}44;border-radius:12px;padding:10px 14px;margin-bottom:7px;">
          <div style="display:flex;align-items:center;gap:6px;">
            <span style="font-size:16px;font-weight:800;color:#343432;">${esc(r.name)}</span>
            ${r.night ? `<span style="font-size:10px;font-weight:800;color:#5C4463;background:#F0EAEF;padding:1px 6px;border-radius:6px;">야간</span>` : ""}
          </div>
          ${reasonTag}
        </div>
      `;
    }).join("");
    return `
      <div style="margin-bottom:16px;">
        <div style="font-size:13px;font-weight:800;color:#5A5852;margin-bottom:8px;">${floor} · ${fl.length}명</div>
        ${rows}
      </div>
    `;
  }).join("");

  const titleFloor = floorFilter ? ` <span style="font-size:15px;font-weight:700;color:#9E9C96;">${floorFilter}</span>` : "";

  return `
    <div onclick="closeStatusList()" style="position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;display:flex;align-items:flex-end;justify-content:center;">
      <div onclick="event.stopPropagation()" style="background:#F8F7F4;width:100%;max-width:600px;border-top-left-radius:20px;border-top-right-radius:20px;padding:20px;max-height:75vh;overflow-y:auto;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
          <div style="display:flex;align-items:center;gap:8px;">
            <span style="font-size:20px;font-weight:800;color:${s.color};">${s.label}${titleFloor}</span>
            <span style="font-size:16px;font-weight:700;color:#9E9C96;">${list.length}명</span>
          </div>
          <button onclick="closeStatusList()" style="border:none;background:#EFEDE8;border-radius:50%;width:32px;height:32px;font-size:16px;color:#5A5852;">✕</button>
        </div>
        ${list.length === 0 ? `<div style="text-align:center;color:#9E9C96;padding:30px;font-size:14px;">${s.label} 어르신이 없어요</div>` : byFloor}
      </div>
    </div>
  `;
}

function renderResetConfirm(){
  if (!S.confirmReset) return "";
  const label = formatDateLabel(S.selectedDate);
  return `
    <div onclick="cancelResetDay()" style="position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;">
      <div onclick="event.stopPropagation()" style="background:#F8F7F4;width:100%;max-width:340px;border-radius:20px;padding:24px;text-align:center;">
        <div style="font-size:34px;margin-bottom:10px;">⚠️</div>
        <div style="font-size:18px;font-weight:800;color:#343432;margin-bottom:8px;">기록을 초기화할까요?</div>
        <div style="font-size:14px;color:#7A7872;line-height:1.5;margin-bottom:20px;">
          <b>${label}</b>의 출석·조식 기록이 모두 지워져요.<br>어르신 명단과 차량 배정은 그대로 유지돼요.
        </div>
        <div style="display:flex;gap:10px;">
          <button onclick="cancelResetDay()" style="flex:1;padding:13px;border-radius:12px;border:2px solid #DEDBD3;background:#fff;color:#5A5852;font-size:15px;font-weight:700;">취소</button>
          <button onclick="doResetDay()" style="flex:1;padding:13px;border-radius:12px;border:none;background:#C98D74;color:#fff;font-size:15px;font-weight:700;">초기화</button>
        </div>
      </div>

function renderCalendar(){
  if (!S.showCalendar) return "";
  const [y, m] = S.calMonth.split("-").map(Number);
  const first = new Date(y, m-1, 1);
  const startDow = first.getDay(); // 0=일
  const daysInMonth = new Date(y, m, 0).getDate();
  const tKey = todayKey();
  const monthLabel = `${y}년 ${m}월`;
  const dowNames = ["일","월","화","수","목","금","토"];

  let cells = "";
  for (let i = 0; i < startDow; i++) cells += `<div></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const key = `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const isSel = key === S.selectedDate;
    const isToday = key === tKey;
    const cnt = presentCountFor(key);
    const dow = new Date(y, m-1, d).getDay();
    const dateColor = dow === 0 ? "#C98D74" : (dow === 6 ? "#6B8FA3" : "#343432");
    cells += `
      <div onclick="pickCalDate('${key}')" style="aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:10px;cursor:pointer;
        background:${isSel ? "#6B8A7A" : (isToday ? "#EAF0EC" : "transparent")};
        border:1.5px solid ${isToday && !isSel ? "#6B8A7A" : "transparent"};">
        <span style="font-size:14px;font-weight:700;color:${isSel ? "#fff" : dateColor};">${d}</span>
        ${cnt > 0 ? `<span style="font-size:10px;font-weight:800;color:${isSel ? "#EAF0EC" : "#6B8A7A"};">${cnt}명</span>` : `<span style="font-size:10px;">&nbsp;</span>`}
      </div>
    `;
  }

  return `
    <div onclick="closeCalendar()" style="position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:150;display:flex;align-items:center;justify-content:center;padding:20px;">
      <div onclick="event.stopPropagation()" style="background:#F8F7F4;width:100%;max-width:380px;border-radius:20px;padding:20px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
          <button onclick="shiftCalMonth(-1)" style="background:#EFEDE8;border:none;border-radius:10px;width:36px;height:36px;font-size:18px;color:#5A5852;">‹</button>
          <div style="font-size:17px;font-weight:800;color:#343432;">${monthLabel}</div>
          <button onclick="shiftCalMonth(1)" style="background:#EFEDE8;border:none;border-radius:10px;width:36px;height:36px;font-size:18px;color:#5A5852;">›</button>
        </div>
        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:6px;">
          ${dowNames.map((n,i) => `<div style="text-align:center;font-size:12px;font-weight:700;color:${i===0?"#C98D74":(i===6?"#6B8FA3":"#9E9C96")};">${n}</div>`).join("")}
        </div>
        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;">
          ${cells}
        </div>
        <div style="display:flex;gap:8px;margin-top:16px;">
          <button onclick="pickCalDate('${tKey}')" style="flex:1;padding:12px;border-radius:12px;border:2px solid #6B8A7A;background:#fff;color:#6B8A7A;font-size:14px;font-weight:800;">오늘로</button>
          <button onclick="closeCalendar()" style="flex:1;padding:12px;border-radius:12px;border:none;background:#6B8A7A;color:#fff;font-size:14px;font-weight:800;">닫기</button>
        </div>
        <button onclick="openStats()" style="width:100%;margin-top:8px;padding:12px;border-radius:12px;border:none;background:#5C4463;color:#fff;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px;">
          <span>📈</span><span>이달의 통계 (출석일수·결석사유)</span>
        </button>
        <div style="text-align:center;font-size:11px;color:#9E9C96;margin-top:10px;">날짜 아래 숫자는 그날 출석 인원이에요</div>
      </div>
    </div>
  `;
}

function renderStats(){
  if (!S.showStats) return "";
  const [y, m] = S.calMonth.split("-").map(Number);
  const monthLabel = `${y}년 ${m}월`;
  const { perPerson, reasonCounts, reasonDetails, dayCount } = computeMonthStats();

  // 개인별 출석일수: 층별로 나눠서, 출석 많은 순
  const personBlocks = FLOORS.map(floor => {
    const people = S.residents
      .filter(r => r.floor === floor)
      .map(r => ({ ...r, stat: perPerson[r.id] || { present:0, absent:0, expected:0 } }))
      .filter(r => r.stat.present > 0 || r.stat.absent > 0 || r.stat.expected > 0)
      .sort((a, b) => b.stat.present - a.stat.present || a.name.localeCompare(b.name, "ko"));
    if (people.length === 0) {
      return `
        <div style="margin-bottom:14px;">
          <div style="font-size:13px;font-weight:800;color:#6B8A7A;margin-bottom:8px;">${floor}</div>
          <div style="font-size:12px;color:#9E9C96;padding:6px 2px;">기록 없음</div>
        </div>`;
    }
    const rows = people.map(r => `
      <div style="display:flex;align-items:center;justify-content:space-between;background:#fff;border:1.5px solid #ECEAE5;border-radius:10px;padding:9px 12px;margin-bottom:6px;">
        <span style="font-size:15px;font-weight:700;color:#343432;">${esc(r.name)}${r.night ? ` <span style="font-size:10px;font-weight:800;color:#5C4463;">야간</span>` : ""}</span>
        <span style="display:flex;align-items:center;gap:8px;">
          <span style="font-size:15px;font-weight:800;color:#6B8A7A;">출석 ${r.stat.present}일</span>
          ${r.stat.absent > 0 ? `<span style="font-size:12px;font-weight:700;color:#D39282;">결석 ${r.stat.absent}</span>` : ""}
        </span>
      </div>
    `).join("");
    return `
      <div style="margin-bottom:16px;">
        <div style="font-size:13px;font-weight:800;color:#6B8A7A;margin-bottom:8px;">${floor} · ${people.length}명</div>
        ${rows}
      </div>
    `;
  }).join("");

  // 결석 사유 집계: 건수 많은 순
  const reasonKeys = Object.keys(reasonCounts).sort((a, b) => reasonCounts[b] - reasonCounts[a]);
  const totalAbsent = reasonKeys.reduce((sum, k) => sum + reasonCounts[k], 0);
  const reasonBlocks = reasonKeys.length === 0
    ? `<div style="font-size:13px;color:#9E9C96;padding:10px 2px;">이번 달 결석 기록이 없어요</div>`
    : reasonKeys.map(reason => {
        const isNone = reason === "사유 미입력";
        const col = isNone ? "#9E9C96" : "#D39282";
        const bg = isNone ? "#F0EFEB" : "#F7ECE8";
        return `
          <div style="background:${bg};border-radius:12px;padding:12px 14px;margin-bottom:8px;">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
              <span style="font-size:15px;font-weight:800;color:${col};">${esc(reason)}</span>
              <span style="font-size:15px;font-weight:800;color:${col};">${reasonCounts[reason]}건</span>
            </div>
            <div style="font-size:12px;color:#7A7872;line-height:1.6;">${reasonDetails[reason].map(esc).join(", ")}</div>
          </div>
        `;
      }).join("");

  return `
    <div onclick="closeStats()" style="position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:160;display:flex;align-items:flex-end;justify-content:center;">
      <div onclick="event.stopPropagation()" style="background:#F8F7F4;width:100%;max-width:600px;border-top-left-radius:20px;border-top-right-radius:20px;padding:20px;max-height:82vh;overflow-y:auto;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
          <div style="display:flex;align-items:center;gap:8px;">
            <button onclick="shiftCalMonth(-1)" style="background:#EFEDE8;border:none;border-radius:8px;width:30px;height:30px;font-size:16px;color:#5A5852;">‹</button>
            <span style="font-size:18px;font-weight:800;color:#343432;">${monthLabel} 통계</span>
            <button onclick="shiftCalMonth(1)" style="background:#EFEDE8;border:none;border-radius:8px;width:30px;height:30px;font-size:16px;color:#5A5852;">›</button>
          </div>
          <button onclick="closeStats()" style="border:none;background:#EFEDE8;border-radius:50%;width:32px;height:32px;font-size:16px;color:#5A5852;">✕</button>
        </div>
        <div style="font-size:12px;color:#9E9C96;margin-bottom:16px;">이번 달 기록이 있는 날: ${dayCount}일</div>

        <div style="font-size:15px;font-weight:800;color:#343432;margin-bottom:10px;">📅 개인별 출석일수</div>
        ${personBlocks}

        <div style="font-size:15px;font-weight:800;color:#343432;margin:20px 0 10px;">🩺 결석 사유 집계 ${totalAbsent > 0 ? `<span style="font-size:13px;font-weight:700;color:#9E9C96;">(총 ${totalAbsent}건)</span>` : ""}</div>
        ${reasonBlocks}
      </div>
    </div>
  `;
}

function renderLongAbsent(){
  if (!S.longAbsent) return "";
  const { name, from, to, reason } = S.longAbsent;
  return `
    <div onclick="closeLongAbsent()" style="position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:170;display:flex;align-items:center;justify-content:center;padding:20px;">
      <div onclick="event.stopPropagation()" style="background:#F8F7F4;width:100%;max-width:360px;border-radius:20px;padding:22px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
          <div style="font-size:18px;font-weight:800;color:#343432;">기간 결석 지정</div>
          <button onclick="closeLongAbsent()" style="border:none;background:#EFEDE8;border-radius:50%;width:30px;height:30px;font-size:15px;color:#5A5852;">✕</button>
        </div>
        <div style="font-size:14px;font-weight:700;color:#B08575;margin-bottom:16px;">${esc(name)} 어르신</div>

        <div style="font-size:12px;font-weight:800;color:#5A5852;margin-bottom:5px;">시작일</div>
        <input id="longAbsentFrom" type="date" value="${from}" onchange="updateLongAbsentField('from', this.value)"
          style="width:100%;padding:11px 12px;border-radius:10px;border:1.5px solid #DEDBD3;font-size:15px;background:#fff;color:#343432;margin-bottom:12px;box-sizing:border-box;" />

        <div style="font-size:12px;font-weight:800;color:#5A5852;margin-bottom:5px;">종료일</div>
        <input id="longAbsentTo" type="date" value="${to}" onchange="updateLongAbsentField('to', this.value)"
          style="width:100%;padding:11px 12px;border-radius:10px;border:1.5px solid #DEDBD3;font-size:15px;background:#fff;color:#343432;margin-bottom:12px;box-sizing:border-box;" />

        <div style="font-size:12px;font-weight:800;color:#5A5852;margin-bottom:5px;">사유 (선택)</div>
        <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px;">
          ${["입원","병원","개인사정","여행"].map(rs => `<button onclick="document.getElementById('longAbsentReason').value='${rs}'" style="padding:6px 11px;border-radius:8px;border:1.5px solid #E3D5D0;background:#fff;color:#B08575;font-size:12px;font-weight:700;">${rs}</button>`).join("")}
        </div>
        <input id="longAbsentReason" value="${esc(reason || "")}" placeholder="예: 입원"
          style="width:100%;padding:11px 12px;border-radius:10px;border:1.5px solid #DEDBD3;font-size:15px;background:#fff;color:#343432;margin-bottom:12px;box-sizing:border-box;" />

        <div id="longAbsentPreview" style="font-size:13px;color:#7A6238;background:#F6F1E4;border-radius:10px;padding:10px 12px;margin-bottom:16px;text-align:center;">${longAbsentPreviewText()}</div>

        <div style="display:flex;gap:10px;">
          <button onclick="closeLongAbsent()" style="flex:1;padding:13px;border-radius:12px;border:2px solid #DEDBD3;background:#fff;color:#5A5852;font-size:15px;font-weight:700;">취소</button>
          <button onclick="applyLongAbsent()" style="flex:1;padding:13px;border-radius:12px;border:none;background:#D39282;color:#fff;font-size:15px;font-weight:800;">결석 지정</button>
        </div>
        <div style="font-size:11px;color:#9E9C96;text-align:center;margin-top:10px;">일요일은 자동으로 빠져요</div>
      </div>
    </div>
  `;
}

function render(){
  const app = document.getElementById("app");
  if (!S.loaded) {
    app.innerHTML = renderHeader() + renderTabs() + `<div class="content"><div class="empty-box">불러오는 중...</div></div>`;
    return;
  }

  const isToday = S.selectedDate === todayKey();
  const searchable = (S.tab === "slides" || S.tab === "floor2" || S.tab === "floor3" || S.tab === "vehicle");
  let body = "";
  if (S.residents.length === 0 && S.tab !== "roster") {
    body = renderEmptyState();
  } else if (searchable && S.search.trim()) {
    body = renderSearchBar() + `<div id="searchResults">${renderSearchResults()}</div>`;
  } else if (S.tab === "slides") {
    body = renderSearchBar() + `<div id="searchResults"></div>` + renderSlides();
  } else if (S.tab === "floor2") {
    body = renderSearchBar() + `<div id="searchResults"></div>` + renderFloorTab("2층");
  } else if (S.tab === "floor3") {
    body = renderSearchBar() + `<div id="searchResults"></div>` + renderFloorTab("3층");
  } else if (S.tab === "vehicle") {
    body = renderSearchBar() + `<div id="searchResults"></div>` + renderVehicleTab();
  } else if (S.tab === "roster") {
    body = renderRosterTab();
  }

  const banner = (!isToday && S.tab !== "roster") ? `<div class="date-banner">${formatDateLabel(S.selectedDate)} 기록을 보고 있어요</div>` : "";

  app.innerHTML = renderHeader() + renderTabs() + `<div class="content">${banner}${body}</div>` + renderStatusModal() + renderResetConfirm() + renderCalendar() + renderStats() + renderLongAbsent();

  const nameInput = document.getElementById("newNameInput");
  if (nameInput) {
    nameInput.focus();
    const val = nameInput.value;
    nameInput.value = "";
    nameInput.value = val;
  }
  // 검색칸은 사용자가 직접 만지고 있을 때만 포커스를 되돌려줌.
  // (출석 버튼 등을 눌러 다시 그릴 때 커서가 검색칸으로 튀는 문제 방지)
  const searchInput = document.getElementById("searchInput");
  if (searchInput && S._searchFocused) {
    const val = searchInput.value;
    searchInput.focus();
    const len = val.length;
    try { searchInput.setSelectionRange(len, len); } catch(e){}
  }
}

loadAll();
</script>
</body>
</html>
